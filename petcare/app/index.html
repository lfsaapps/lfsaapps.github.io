<title>PetCare: Vacinas do Cão e Gato</title>
<meta name="description" content="PetCare: a saúde do seu animal, no telemóvel. Grátis para Android e iPhone. Your pet's health, on your phone. Free for Android and iPhone.">
<meta property="og:title" content="PetCare: Vacinas do Cão e Gato">
<meta property="og:description" content="Vacinas e desparasitações com alarme no dia certo. Grátis para Android e iPhone.">

<style>
  :root { --texto: #2b2118; --mudo: #6b5a47; --acento: #ffb300; --amarelo: #ffd23f; --borda: #f0e0c0; --fundo: #fff8ec; --petroleo: #0f4c4c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: var(--fundo); line-height: 1.5; }
  a { color: inherit; }
  .faixa { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

  header.topo { background: linear-gradient(135deg, var(--amarelo), var(--acento)); }
  .barra { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; gap: 12px; flex-wrap: wrap; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 20px; text-decoration: none; }
  .marca img { width: 40px; height: 40px; border-radius: 10px; }
  .linguas { display: flex; flex-wrap: wrap; gap: 6px; }
  .linguas button { border: 0; background: rgba(255,255,255,.55); color: var(--texto); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .linguas button[aria-pressed="true"] { background: var(--texto); color: #fff; }

  .heroi { display: grid; grid-template-columns: 1.15fr .85fr; gap: 28px; align-items: center; padding: 26px 0 40px; }
  h1 { font-size: 44px; line-height: 1.1; font-weight: 900; }
  .sub { font-size: 18px; margin-top: 14px; max-width: 470px; }
  .lojas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  a.loja { display: inline-block; text-decoration: none; background: var(--texto); color: #fff; border-radius: 14px; padding: 11px 18px; font-weight: 800; font-size: 16px; min-width: 170px; text-align: center; }
  a.loja small { display: block; font-weight: 600; font-size: 12px; opacity: .8; }
  .gratis-linha { margin-top: 10px; font-weight: 700; font-size: 14px; }
  .cartao-qr { background: #fff; border-radius: 22px; padding: 18px; text-align: center; box-shadow: 0 10px 30px rgba(80,50,0,.15); max-width: 300px; justify-self: center; position: relative; }
  .cartao-qr img.lucky { width: 120px; position: absolute; left: -128px; bottom: -4px; }
  .cartao-qr .qr { width: 220px; height: 220px; display: block; margin: 0 auto; }
  .cartao-qr p { font-weight: 800; margin-top: 8px; }
  .cartao-qr small { color: var(--mudo); display: block; margin-top: 4px; font-size: 12.5px; }

  section { padding: 44px 0; }
  h2 { font-size: 30px; font-weight: 900; text-align: center; margin-bottom: 26px; }
  .funcoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .funcao { background: #fff; border: 1px solid var(--borda); border-radius: 18px; padding: 12px 12px 16px; text-align: center; }
  .funcao img { width: 100%; border-radius: 12px; display: block; aspect-ratio: 9 / 16; object-fit: cover; background: #ffe9a8; }
  .funcao h3 { font-size: 17px; margin-top: 12px; }
  .funcao p { font-size: 14px; color: var(--mudo); margin-top: 4px; }

  .escuro { background: var(--petroleo); color: #fff; }
  .planos { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 820px; margin: 0 auto; }
  .plano { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; padding: 20px 22px; }
  .plano h3 { font-size: 20px; color: var(--amarelo); margin-bottom: 8px; }
  .plano ul { list-style: none; }
  .plano li { padding: 5px 0 5px 26px; position: relative; }
  .plano li::before { content: "✓"; position: absolute; left: 0; color: var(--amarelo); font-weight: 900; }
  .nota-ads { text-align: center; margin-top: 14px; font-size: 14px; opacity: .85; }

  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .bloco { background: #fff; border: 1px solid var(--borda); border-radius: 18px; padding: 22px; display: flex; gap: 16px; align-items: center; }
  .bloco .icone { font-size: 38px; }
  .bloco img { width: 110px; flex: none; }
  .bloco h3 { font-size: 19px; margin-bottom: 4px; }
  .bloco p { color: var(--mudo); font-size: 15px; }

  footer { background: var(--texto); color: #f3e6d0; padding: 26px 0 30px; font-size: 14px; text-align: center; }
  footer .redes { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  footer .redes a { font-weight: 800; text-decoration: none; color: var(--amarelo); }
  footer p { margin-top: 4px; opacity: .85; }

  @media (max-width: 860px) {
    .heroi { grid-template-columns: 1fr; text-align: center; }
    .sub { margin-left: auto; margin-right: auto; }
    .lojas { justify-content: center; }
    .cartao-qr img.lucky { display: none; }
    .funcoes { grid-template-columns: 1fr 1fr; }
    .planos, .duas { grid-template-columns: 1fr; }
    h1 { font-size: 34px; }
  }
  @media (max-width: 420px) { .funcoes { grid-template-columns: 1fr; } }
</style>

var ORDEM = ["pt-PT", "pt-BR", "en", "es", "fr", "de"];

function escolher(l) {
  l = (l || "").toLowerCase();
  if (l === "pt-br") return "pt-BR";
  if (l.indexOf("pt") === 0) return "pt-PT";
  var b = l.slice(0, 2);
  return T[b] ? b : null;
}
function aplicar(id) {
  var t = T[id];
  document.documentElement.lang = id;
  document.title = t.titulo;
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });
  document.querySelectorAll("[data-lista]").forEach(function (ul) {
    ul.innerHTML = "";
    t[ul.getAttribute("data-lista")].forEach(function (x) { var li = document.createElement("li"); li.textContent = x; ul.appendChild(li); });
  });
  document.querySelectorAll("[data-img]").forEach(function (img) { img.src = "img/" + id + "-" + img.getAttribute("data-img") + ".webp"; img.alt = t.titulo; });
  document.querySelectorAll("#linguas button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.l === id ? "true" : "false"); });
}

(function () {
  var nav = document.getElementById("linguas");
  ORDEM.forEach(function (id) {
    var b = document.createElement("button");
    b.type = "button"; b.dataset.l = id; b.textContent = T[id].nome;
    b.onclick = function () { aplicar(id); };
    nav.appendChild(b);
  });
  var forcada = new URLSearchParams(location.search).get("lang");
  var lista = forcada ? [forcada] : (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]);
  var id = null;
  for (var i = 0; i < lista.length && !id; i++) id = escolher(lista[i]);
  id = id || "en";
  aplicar(id);
  window.PETCARE_ABRIR = T[id].abrir;
})();
</script>
<script>
// Um só QR/link para as duas lojas: Android vai para a Google Play, iPhone para a App Store; no computador mostra a página.
// ?c=<canal> (ex.: folheto, veterinarios, instagram, grupos, site) segue para as lojas para saber de onde vêm
// as instalações (Google Play: referrer UTM; App Store: ct).
(function () {
  var c = (new URLSearchParams(location.search).get("c") || "").replace(/[^a-z0-9_-]/gi, "").slice(0, 40);
  var g = document.getElementById("google"), a = document.getElementById("apple");
  if (c) {
    g.href += "&referrer=" + encodeURIComponent("utm_source=" + c + "&utm_medium=qr&utm_campaign=lancamento");
    a.href += "?ct=" + encodeURIComponent(c);
  }
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  if (android || ios) {
    document.getElementById("aviso").textContent = window.PETCARE_ABRIR || "A abrir a loja…";
    setTimeout(function () { location.replace((android ? g : a).href); }, 300);
  }
})();
</script>
