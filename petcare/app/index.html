<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetCare — instalar</title>
<meta name="description" content="PetCare: a caderneta de saúde do seu animal, no telemóvel. Grátis para Android e iPhone.">
<link rel="icon" href="../icone-512.png">
<style>
  :root { --texto: #2b2118; --mudo: #6b5a47; --acento: #ffb300; --borda: #f0e0c0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: #fff8ec; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 420px; background: #fff; border: 1px solid var(--borda); border-radius: 20px; padding: 28px 22px; text-align: center; }
  .topo { background: linear-gradient(135deg, #ffd23f, #ffb300); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
  h1 { font-size: 30px; font-weight: 900; }
  .topo p { font-weight: 700; margin-top: 4px; }
  .aviso { color: var(--mudo); font-size: 15px; margin-bottom: 18px; min-height: 1.3em; }
  a.loja { display: block; text-decoration: none; background: var(--texto); color: #fff; border-radius: 14px; padding: 14px 16px; margin: 10px 0; font-weight: 800; font-size: 17px; }
  a.loja small { display: block; font-weight: 600; font-size: 13px; opacity: .8; margin-top: 2px; }
  .nota { color: var(--mudo); font-size: 12.5px; margin-top: 16px; line-height: 1.4; }
</style>
</head>
<body>
<main>
  <div class="topo"><h1>PetCare</h1><p>A caderneta de saúde do seu animal, no telemóvel</p></div>
  <p class="aviso" id="aviso">Escolha a loja do seu telemóvel:</p>
  <a class="loja" id="google" href="https://play.google.com/store/apps/details?id=pt.lfsaapps.petcare">Google Play<small>Android</small></a>
  <a class="loja" id="apple" href="https://apps.apple.com/app/id6829416820">App Store<small>iPhone</small></a>
  <p class="nota">Grátis. Vacinas e lembretes sempre grátis; Premium opcional.<br>A app não substitui o médico veterinário.<br>LFSA Apps · lfsaapps@gmail.com</p>
</main>
<script>
// Um só QR/link para as duas lojas: Android vai para a Google Play, iPhone para a App Store; no computador ficam os
// dois botões. ?c=<canal> (ex.: folheto, veterinarios, instagram, grupos) segue para as lojas para saber de onde vêm
// as instalações (Google Play: referrer UTM; App Store: ct).
(function () {
  var c = (new URLSearchParams(location.search).get("c") || "").replace(/[^a-z0-9_-]/gi, "").slice(0, 40);
  var g = document.getElementById("google"), a = document.getElementById("apple");
  if (c) {
    g.href += "&referrer=" + encodeURIComponent("utm_source=" + c + "&utm_medium=qr&utm_campaign=lancamento");
    a.href += "?ct=" + encodeURIComponent(c);
  }
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  if (android || ios) {
    document.getElementById("aviso").textContent = "A abrir a loja…";
    setTimeout(function () { location.replace((android ? g : a).href); }, 300);
  }
})();
</script>
</body>
</html>
